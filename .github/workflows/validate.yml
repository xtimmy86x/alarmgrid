name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hacs:
    name: HACS
    runs-on: ubuntu-latest
    steps:
      - name: HACS validation
        uses: hacs/action@main
        with:
          category: integration

  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run unit tests
        run: python3 -m unittest discover -s tests -v

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check frontend bundle syntax
        run: node --check custom_components/alarmgrid/frontend/dist/alarmgrid.js

  publish_211:
    name: Publish AlarmGrid 2.1.1
    needs: [hacs, tests]
    if: "${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && github.event.head_commit.message == 'chore: publish AlarmGrid 2.1.1' }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out validated release
        uses: actions/checkout@v4
        with:
          ref: 215ccc1b0f76559459f4f4affd67b7bef50739be
      - name: Publish 2.1.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create 2.1.1 \
            --target 215ccc1b0f76559459f4f4affd67b7bef50739be \
            --title "AlarmGrid 2.1.1" \
            --notes-file RELEASE_NOTES.md
