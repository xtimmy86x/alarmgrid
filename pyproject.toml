[project]
name = "alarmgrid"
version = "2.0.0"
description = "Industrial Alarm Management for Home Assistant"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
dependencies = []

[project.urls]
Homepage = "https://github.com/xtimmy86x/alarmgrid"
Repository = "https://github.com/xtimmy86x/alarmgrid"
Documentation = "https://github.com/xtimmy86x/alarmgrid"
Issues = "https://github.com/xtimmy86x/alarmgrid/issues"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
